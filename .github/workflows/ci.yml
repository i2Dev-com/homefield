name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksum-verified (the asset's digest in the GitHub release
      # API), so the lint does not drift with the runner image, and — as for
      # actionlint below — nothing in this CI executes a download that has not
      # been verified. A new shellcheck version is a deliberate bump of both
      # values.
      - name: Shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --strip-components=1
          ./shellcheck bin/homefield install.sh vm/provision.sh vm/guest/* routing-guard/tests/run.sh tests/*.sh

      # Pinned and hash-verified, as actionlint and shellcheck above: the wheel
      # is downloaded, its sha256 checked, and only then installed and run.
      # A new ruff version is a deliberate bump of both values (the wheel's
      # sha256 in the PyPI JSON API, pypi.org/pypi/ruff/json; the manylinux
      # x86_64 wheel — ubuntu-latest is x86_64, and the wheel is py3-none).
      - name: Lint the Python tools
        env:
          RUFF_VERSION: 0.17.3
          RUFF_SHA256: 7fa4b0f931cdbcb8a52044f370a3eb429fb42eb88807b0e800fcaa98dd42b24e
        run: |
          set -euo pipefail
          python3 -m pip download --quiet --no-deps --only-binary :all: \
            -d ruff-wheel "ruff==${RUFF_VERSION}"
          wheel="ruff-wheel/ruff-${RUFF_VERSION}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          echo "${RUFF_SHA256}  ${wheel}" | sha256sum -c -
          python3 -m pip install --quiet --no-index --find-links ruff-wheel "ruff==${RUFF_VERSION}"
          python3 -m py_compile tools/*.py routing-guard/routing_guard.py
          python3 -m ruff check tools/ routing-guard/

      # Pinned and checksum-verified. Other repositories run this repository's
      # action to guard their routing, so nothing in its CI executes a download
      # that has not been verified. A new actionlint version is a deliberate
      # bump of both values (the asset's `digest` in the GitHub release API).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color

      - name: routing_guard.py fixture suite
        run: bash routing-guard/tests/run.sh

      - name: Routing label rule, provision.sh and routing_guard.py agree
        run: bash tests/label-rule.sh

      - name: Release references agree
        run: bash tests/release-refs.sh

      - name: RUNNER_EXTRA_PACKAGES validation
        run: bash tests/extra-packages.sh

      - name: RUNNER_URL validation
        run: bash tests/runner-url.sh

      - name: Guest memory sampler
        run: bash tests/memwatch.sh

      - name: Workspace ownership hook
        run: bash tests/workspace-owner.sh

      - name: Host loopback probe
        run: bash tests/loopback-probe.sh

      - name: provision.sh restarts a runner it stopped
        run: bash tests/provision-recovery.sh

      - name: homefield uninstall restores the service
        run: bash tests/uninstall.sh

      - name: homefield reset rolls back an install
        run: bash tests/reset.sh

      - name: Every VM on this Mac by default
        run: bash tests/instances.sh

      - name: homefield status without the runner's settings
        run: bash tests/status.sh

      - name: homefield diagnose report
        run: bash tests/diagnose.sh

      - name: bin/homefield memory summary
        run: bash tests/memory-summary.sh

      - name: bin/homefield report
        run: bash tests/report.sh

      - name: install.sh
        run: bash tests/install-sh.sh

      - name: Runner group, wait for online, version
        run: bash tests/runner-group.sh

      - name: Personal account or organization (install)
        run: bash tests/account-type.sh

      - name: bin/homefield setup
        run: bash tests/setup.sh

      - name: bin/homefield adopt
        run: bash tests/adopt.sh

      - name: bin/homefield preflight
        run: bash tests/preflight.sh

      # The action as consumers call it, not just the script behind it: inputs
      # through env, $GITHUB_ACTION_PATH resolution, composite wiring.
      - name: Action against the clean fixture
        uses: ./routing-guard
        with:
          workflows-dir: routing-guard/tests/base
          jobs: |
            ci.yml:changes
            ci.yml:checks

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  actions: read

# A new push to the same branch cancels the run it supersedes: the
# suites take minutes, and during a review round the superseded
# run's result is nobody's answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A squash merge lands a new sha on main whose tree can be byte-identical
  # to the pull request head this workflow just tested green - namely when
  # the PR branched from the commit that was main when it merged. Re-running
  # the suites on the same bytes can only catch runner flakiness, so this
  # gate looks for a pull request whose head tree equals the pushed commit's
  # tree and whose CI run succeeded, and the two jobs below skip when it
  # finds one. The run must be a successful pull_request run of the PR's
  # branch (those check out the merge ref: the base the PR targeted plus
  # the head), and the PR must target the pushed branch - with the tree
  # equality, the head contains the whole base any such run used, so the
  # merge ref it checked out is byte-identical to this tree. When main
  # moved after the PR was tested, the pushed tree is a combination no PR
  # run has tested and CI runs: that combination check is the one thing
  # only a main run can do. Direct pushes and every lookup failure fall
  # through to a full run.
  already-tested:
    name: Skip if this tree was already tested
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        # No set -e on purpose: an API error must fall through to a full
        # run, not fail the gate. A failed call leaves its variable empty,
        # the comparisons below then miss, and skip stays false.
        run: |
          set -uo pipefail
          skip=false
          push_tree="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.tree.sha' 2>/dev/null || true)"
          for number in $(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].number' 2>/dev/null || true); do
            # Only a pull request into the pushed branch can have tested
            # this tree: a pull_request run checks out the merge ref (the
            # base the PR targeted at run time plus the head), so a PR
            # into another branch tests a different base and never counts.
            pr_info="$(gh api "repos/$REPO/pulls/$number" --jq '[.base.ref, .head.ref, .head.sha] | @tsv' 2>/dev/null || true)"
            [ -n "$pr_info" ] || continue
            IFS=$'\t' read -r base_ref head_ref head_sha <<<"$pr_info"
            [ "$base_ref" = "$BRANCH" ] && [ -n "$head_sha" ] || continue
            head_tree="$(gh api "repos/$REPO/commits/$head_sha" --jq '.commit.tree.sha' 2>/dev/null || true)"
            [ -n "$push_tree" ] && [ "$head_tree" = "$push_tree" ] || continue
            # With the tree equality above, the head contains the whole
            # base any of its runs used (the base is an ancestor of the
            # commit this push landed on), so the merge ref those runs
            # checked out is byte-identical to this tree: the tested tree
            # is this tree, not merely a tree sharing the head sha. The
            # run must be a successful pull_request run of this branch;
            # pull_requests[] on the run would name the PR directly but is
            # emptied once the PR merges, so head_branch carries the
            # association. Residual assumption, accepted: the PR's base at
            # run time was this branch - a PR retargeted from another
            # base, or a twin PR from the same branch into another base,
            # could get a needed run skipped, and the next PR's CI catches
            # that main state.
            jq_branch="${head_ref//\\/\\\\}"; jq_branch="${jq_branch//\"/\\\"}"
            if [ "$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head_sha" --jq "any(.workflow_runs[]; .event == \"pull_request\" and .conclusion == \"success\" and .head_branch == \"$jq_branch\")" 2>/dev/null || true)" = true ]; then
              echo "PR #$number head $head_sha is this exact tree and CI passed there; skipping"
              skip=true
              break
            fi
          done
          echo "skip=$skip" >>"$GITHUB_OUTPUT"

  test:
    name: Lint & test
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${PUSH_SHA}"
          fi
          if [ -n "$range" ] && changed="$(git diff --name-only "$range" 2>/dev/null)" && [ -n "$changed" ]; then
            docs_only=true
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                *.md | docs/assets/*) ;;
                *) docs_only=false; break ;;
              esac
            done <<<"$changed"
          fi
          echo "docs_only=${docs_only}" >>"$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}"

      # Pinned and checksum-verified (the asset's digest in the GitHub release
      # API), so the lint does not drift with the runner image, and — as for
      # actionlint below — nothing in this CI executes a download that has not
      # been verified. A new shellcheck version is a deliberate bump of both
      # values.
      - name: Shellcheck
        if: steps.changes.outputs.docs_only != 'true'
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --strip-components=1
          # The bin/ modules are clean at warning level; two info-level SC2153s in
          # bin/cmd-preflight.sh remain, so the severity is pinned here.
          ./shellcheck --severity=warning bin/homefield install.sh bin/cmd-*.sh bin/lib/*.sh \
            vm/provision.sh vm/guest/* vm/presets/*/*.sh \
            routing-guard/tests/run.sh tests/*.sh

      # Pinned and hash-verified, as actionlint and shellcheck above: the wheel
      # is downloaded, its sha256 checked, and only then installed and run.
      # A new ruff version is a deliberate bump of both values (the wheel's
      # sha256 in the PyPI JSON API, pypi.org/pypi/ruff/json; the manylinux
      # x86_64 wheel — ubuntu-latest is x86_64, and the wheel is py3-none).
      - name: Lint the Python tools
        if: steps.changes.outputs.docs_only != 'true'
        env:
          RUFF_VERSION: 0.17.3
          RUFF_SHA256: 7fa4b0f931cdbcb8a52044f370a3eb429fb42eb88807b0e800fcaa98dd42b24e
        run: |
          set -euo pipefail
          python3 -m pip download --quiet --no-deps --only-binary :all: \
            -d ruff-wheel "ruff==${RUFF_VERSION}"
          wheel="ruff-wheel/ruff-${RUFF_VERSION}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          echo "${RUFF_SHA256}  ${wheel}" | sha256sum -c -
          python3 -m pip install --quiet --no-index --find-links ruff-wheel "ruff==${RUFF_VERSION}"
          python3 -m py_compile tools/*.py routing-guard/routing_guard.py
          python3 -m ruff check tools/ routing-guard/

      # Pinned and checksum-verified. Other repositories run this repository's
      # action to guard their routing, so nothing in its CI executes a download
      # that has not been verified. A new actionlint version is a deliberate
      # bump of both values (the asset's `digest` in the GitHub release API).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color

      # tests/run-suites.sh runs every suite in a bounded worker pool, so a
      # new tests/*.sh is in CI by existing and the lead time is the slowest
      # few suites rather than their sum. Each suite's output is printed in
      # order, failures are reported without stopping the others, and the
      # step fails at the end if any failed. DOCS_ONLY=true runs only the
      # release-refs check.
      - name: Test suites
        env:
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
        run: |
          set -uo pipefail
          export PATH="$PWD:$PATH"
          bash tests/run-suites.sh

      # The action as consumers call it, not just the script behind it: inputs
      # through env, $GITHUB_ACTION_PATH resolution, composite wiring.
      - name: Action against the clean fixture
        if: steps.changes.outputs.docs_only != 'true'
        uses: ./routing-guard
        with:
          workflows-dir: routing-guard/tests/base
          jobs: |
            ci.yml:changes
            ci.yml:checks

  # The host-side scripts target macOS's stock bash 3.2 and BSD tools; the
  # Linux job alone runs them under bash 5 and GNU tools. /bin first on PATH
  # keeps `bash` at 3.2 (homebrew's newer bash sits later on the runner's
  # PATH); memwatch.sh skips its run in this setup, its lint part always runs.
  test-macos:
    name: Test suites (macOS, bash 3.2)
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="${BASE_SHA}...${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${PUSH_SHA}"
          fi
          if [ -n "$range" ] && changed="$(git diff --name-only "$range" 2>/dev/null)" && [ -n "$changed" ]; then
            docs_only=true
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                *.md | docs/assets/*) ;;
                *) docs_only=false; break ;;
              esac
            done <<<"$changed"
          fi
          echo "docs_only=${docs_only}" >>"$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}"

      - name: Test suites
        env:
          PATH: /bin:/usr/bin:/sbin:/usr/sbin:/opt/homebrew/bin:/usr/local/bin
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
        run: |
          set -uo pipefail
          bash tests/run-suites.sh

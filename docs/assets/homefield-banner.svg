<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source of homefield-banner.png (README image and social preview).
       Render: Chrome headless, window 1280x640; see docs/assets/README.md. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#0d2419"/>
    </linearGradient>
    <pattern id="mow" width="160" height="640" patternUnits="userSpaceOnUse">
      <rect width="80" height="640" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1622" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0b1622" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ee2a8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b9bb0"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Field: night sky over mowed stripes -->
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#mow)"/>
  <rect width="1280" height="640" fill="url(#fade)"/>

  <!-- Mark: a house with a passing check -->
  <g transform="translate(88 150)">
    <path d="M8 46 L48 10 L88 46 V92 a6 6 0 0 1 -6 6 H14 a6 6 0 0 1 -6 -6 Z"
          fill="none" stroke="#3ddc84" stroke-width="8" stroke-linejoin="round"/>
    <path d="M30 60 L44 74 L68 48" fill="none" stroke="#3ddc84" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark and tagline -->
  <text x="200" y="232" font-size="92" font-weight="700" fill="#f2f6fa" letter-spacing="-1.5">HomeField</text>
  <text x="90" y="318" font-size="32" fill="#c9d4e0">Run pull-request CI on your own Mac,</text>
  <text x="90" y="360" font-size="32" fill="#c9d4e0">in an isolated VM, with a hosted fallback.</text>

  <!-- Feature chips -->
  <g font-size="20" fill="#d8f5e4">
    <rect x="90" y="410" width="188" height="44" rx="22" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.5"/>
    <text x="184" y="439" text-anchor="middle">Isolated Lima VM</text>
    <rect x="292" y="410" width="196" height="44" rx="22" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.5"/>
    <text x="390" y="439" text-anchor="middle">One-switch fallback</text>
    <rect x="502" y="410" width="168" height="44" rx="22" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.5"/>
    <text x="586" y="439" text-anchor="middle">Routing guard</text>
  </g>
  <text x="90" y="530" font-size="20" fill="#7d8ea3" class="mono">macOS · Apple Silicon · arm64 jobs</text>

  <!-- Diagram: GitHub Actions dispatches to the Mac's VM, or to a hosted runner -->
  <g>
    <rect x="850" y="86" width="300" height="76" rx="14" fill="#152233" stroke="#33465c"/>
    <text x="1000" y="133" font-size="24" font-weight="600" fill="#e6edf3" text-anchor="middle">GitHub Actions</text>

    <!-- Mac -->
    <rect x="800" y="250" width="290" height="190" rx="16" fill="#111c29" stroke="#3ddc84" stroke-width="2.5"/>
    <text x="820" y="282" font-size="18" fill="#7d8ea3">your Mac</text>
    <rect x="840" y="302" width="210" height="106" rx="10" fill="#3ddc84" fill-opacity="0.1" stroke="#3ddc84" stroke-dasharray="6 5"/>
    <text x="945" y="345" font-size="21" font-weight="600" fill="#e6f9ee" text-anchor="middle">VM · Ubuntu arm64</text>
    <text x="945" y="377" font-size="16" fill="#9fb3c8" text-anchor="middle">no access to your files</text>
    <rect x="890" y="440" width="110" height="10" rx="3" fill="#33465c"/>

    <!-- Hosted fallback -->
    <rect x="1120" y="300" width="120" height="90" rx="14" fill="#152233" stroke="#33465c"/>
    <text x="1180" y="340" font-size="18" fill="#c9d4e0" text-anchor="middle">hosted</text>
    <text x="1180" y="364" font-size="18" fill="#c9d4e0" text-anchor="middle">runner</text>

    <!-- Arrows -->
    <path d="M960 166 L948 244" stroke="#7ee2a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="870" y="214" font-size="16" fill="#7ee2a8" text-anchor="end">CI_RUNNER=local</text>
    <path d="M1060 166 L1160 294" stroke="#8b9bb0" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow-dim)"/>
    <text x="1130" y="214" font-size="16" fill="#8b9bb0">fallback</text>
  </g>
</svg>

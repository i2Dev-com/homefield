# Lima VM for the local GitHub Actions runner.
#
# The VM is the isolation boundary: CI jobs run pull-request code, so nothing
# of the host's — home directory, SSH keys, AWS profile, gh auth — may be
# reachable from inside. Everything below that looks like a missing default is
# deliberate. Setup and recovery: docs/runbook.md.
#
# The guest's outbound network (homefield#18): the networkOpts block at the
# end stops host.lima.internal (192.168.5.2) from mapping to the host's
# loopback, but only on Lima >= 2.3.0 (lima-vm/lima#5581, not in a stable
# release yet; 2.0-2.2 warn "unknown field" and ignore the line, so the
# loopback stays reachable there). `bin/homefield` probes the truth from
# inside the guest on install and upgrade. Services bound to `*` on the Mac
# stay reachable through its LAN address whatever the Lima version.
#
# Requires Lima >= 2.0: `base:` is older (1.1), but the `template:` locator
# below (the `template://` form is deprecated since Lima 2.0 and 1.x may not
# accept the new one). Create with --mount-none as well, so a
# future change to Lima's defaults cannot quietly bring the home mount back.

# Image list only. The `ubuntu-24.04` template would also pull in
# `_default/mounts`, which mounts $HOME into the guest.
base: template:_images/ubuntu-24.04

vmType: vz
arch: aarch64
cpus: 6
# Apple's Virtualization.framework never takes back memory the guest has used,
# and Linux fills spare RAM with page cache, so after a few jobs the VM holds
# this whole amount on the Mac even when idle. Keep it near what jobs need,
# not "as much as can be spared". 5 GiB matches GitHub's `ubuntu-slim` runner.
# Measured over 2026-10-01..14, the highest minute used 4.4 GiB (MemTotal -
# MemAvailable, so cache excluded); if `bin/homefield memory` shows OOM kills,
# raise it (runbook, "Host memory").
memory: 5GiB
disk: 60GiB

mounts: []

ssh:
  # An agent forwarded into the guest is usable by any process in it.
  forwardAgent: false
  loadDotSSHPubKeys: false

# Lima's bundled containerd/nerdctl is not what the runner uses; Docker Engine
# is installed by provision.sh, because job `services:` need the docker CLI.
containerd:
  system: false
  user: false

# Lima forwards every guest listener to the host's localhost by default. Job
# service containers publish 5432 and 6379, which would land on the host —
# colliding with a local dev Postgres/Redis, or worse, being mistaken for them.
portForwards:
  - guestIP: "127.0.0.1"
    guestPortRange: [1, 65535]
    ignore: true
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    ignore: true

# #18: do not map the host loopback into the guest (lima-vm/lima#5581). On
# Lima >= 2.3.0 the gateway answers host.lima.internal itself, so a guest
# connection to it is refused instead of reaching a service listening on the
# Mac's 127.0.0.1; DNS keeps resolving from the gateway. Lima 2.0-2.2 do not
# know the field: they warn "unknown field" and go on ignoring it (checked
# with 2.2.0's `limactl create`), which is why `bin/homefield` verifies the
# block from inside the guest instead of trusting this line, and refuses to
# continue when a VM whose own config asks for it is reachable anyway
# (docs/runbook.md, "Host loopback exposure"). Lima >= 2.3 refuses the ask
# outright (rather than ignoring it) on a vmType other than vz or on a
# user-v2 network; this file is vz with the default network, and #21
# revisits this if that ever changes.
networkOpts:
  hostLoopback: false

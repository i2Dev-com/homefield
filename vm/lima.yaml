# Lima VM for the local GitHub Actions runner.
#
# The VM is the isolation boundary: CI jobs run pull-request code, so nothing
# of the host's — home directory, SSH keys, AWS profile, gh auth — may be
# reachable from inside. Everything below that looks like a missing default is
# deliberate. Setup and recovery: docs/runbook.md.
#
# Not yet covered: the guest's outbound network. Lima's user-mode network maps
# host.lima.internal (192.168.5.2) to the host's loopback, so services on the
# host, even 127.0.0.1-only ones, are reachable from the guest (ci-runner#18).
#
# Requires Lima >= 1.1 (for `base:`). Create with --mount-none as well, so a
# future change to Lima's defaults cannot quietly bring the home mount back.

# Image list only. The `ubuntu-24.04` template would also pull in
# `_default/mounts`, which mounts $HOME into the guest.
base: template://_images/ubuntu-24.04

vmType: vz
arch: aarch64
cpus: 6
# Apple's Virtualization.framework never takes back memory the guest has used,
# and Linux fills spare RAM with page cache, so after a few jobs the VM holds
# this whole amount on the Mac even when idle. Keep it near what jobs need,
# not "as much as can be spared". 5 GiB matches GitHub's `ubuntu-slim` runner.
# Measured over 2026-10-01..14, the highest minute used 4.4 GiB (MemTotal -
# MemAvailable, so cache excluded); if `bin/ci-runner memory` shows OOM kills,
# raise it (runbook, "Host memory").
memory: 5GiB
disk: 60GiB

mounts: []

ssh:
  # An agent forwarded into the guest is usable by any process in it.
  forwardAgent: false
  loadDotSSHPubKeys: false

# Lima's bundled containerd/nerdctl is not what the runner uses; Docker Engine
# is installed by provision.sh, because job `services:` need the docker CLI.
containerd:
  system: false
  user: false

# Lima forwards every guest listener to the host's localhost by default. Job
# service containers publish 5432 and 6379, which would land on the host —
# colliding with a local dev Postgres/Redis, or worse, being mistaken for them.
portForwards:
  - guestIP: "127.0.0.1"
    guestPortRange: [1, 65535]
    ignore: true
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    ignore: true

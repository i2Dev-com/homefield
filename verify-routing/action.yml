name: Verify local-runner routing (deprecated)
description: >-
  Deprecated in favour of routing-guard, which this runs: use
  i2Dev-com/homefield/routing-guard@v3 with `jobs:` in place of `expected:`.
  Kept as an alias, and removed in v4.

inputs:
  expected:
    description: >-
      The jobs allowed to opt in, as `workflow-file:job-id` entries separated
      by newlines, commas or spaces. Empty means no job may opt in.
      Deprecated: this is `jobs` in routing-guard.
    required: false
    default: ''
  label:
    description: >-
      The custom runner label the workflows route on: RUNNER_LABEL in
      provision.sh, and the last label in every inline expression.
    required: false
    default: homefield-ci
  arch:
    description: The runner's architecture label (arm64 or x64).
    required: false
    default: arm64
  workflows-dir:
    description: Directory of workflow files to check, relative to the workspace.
    required: false
    default: .github/workflows

runs:
  using: composite
  steps:
    - name: Verify local-runner routing (deprecated alias of routing-guard)
      shell: bash
      # Inputs go through env, never interpolated into the script, so a value
      # cannot inject shell.
      env:
        INPUT_EXPECTED: ${{ inputs.expected }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../routing-guard/routing_guard.py" \
          --workflows-dir "$INPUT_WORKFLOWS_DIR" \
          --label "$INPUT_LABEL" \
          --arch "$INPUT_ARCH" \
          --jobs "$INPUT_EXPECTED"
